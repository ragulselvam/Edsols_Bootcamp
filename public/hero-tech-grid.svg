<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="blueprint-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#94a3b8" stroke-width="1" stroke-opacity="0.45" />
    </pattern>
    <linearGradient id="grid-fade-x" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="75%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="90%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <mask id="fade-mask">
      <rect width="1440" height="900" fill="url(#grid-fade-x)" />
    </mask>
  </defs>
  <rect width="1440" height="900" fill="url(#blueprint-grid)" mask="url(#fade-mask)" />
</svg>
